name: ci

on:
  push:
    branches: ['**']
  # Reused by release.yml (job test); not triggered by other users.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Native unit tests only, on both systems; Windows also compiles the WinML (DirectML) backend.
      # IntegrationTests (including the static source guards) are run manually before push/release.
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet restore EsilvaSoft.KapibaraStudio.slnx --locked-mode
      - run: dotnet build EsilvaSoft.KapibaraStudio.slnx --no-restore -c Release
      # Explicit project list excludes development benchmarks and IntegrationTests, also when invoked by release.yml.
      # CI never downloads or loads real models: LocalModelIntegration tests are manual only, besides being [Explicit].
      - name: Run unit tests
        run: dotnet test tests/EsilvaSoft.KapibaraStudio.UnitTests/EsilvaSoft.KapibaraStudio.UnitTests.csproj --no-build --no-restore -c Release --filter "TestCategory!=LocalModelIntegration" --logger trx --results-directory TestResults
      - name: Run offline agent unit tests
        run: dotnet test tests/EsilvaSoft.KapibaraStudio.Infrastructure.Agents.Tests/EsilvaSoft.KapibaraStudio.Infrastructure.Agents.Tests.csproj --no-build --no-restore -c Release --logger trx --results-directory TestResults
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn
