name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  copilot-mongodb-integration:
    name: Copilot tools against MongoDB
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SLOP_CONSOLE_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet restore EsilvaSoft.KapibaraStudio.slnx --locked-mode
      - run: dotnet test tests/EsilvaSoft.KapibaraStudio.UnitTests/EsilvaSoft.KapibaraStudio.UnitTests.csproj --no-restore -c Release -p:UsedAvaloniaProducts= --filter FullyQualifiedName~AgentReadToolsUseLiteralCodecPoliciesAndDurableLedgerAgainstRealServer --logger trx --results-directory TestResults
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-mongodb-integration-test-results
          path: TestResults

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The product targets both systems; Windows also compiles the WinML (DirectML) backend.
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - run: dotnet restore EsilvaSoft.KapibaraStudio.slnx --locked-mode
      - run: dotnet build EsilvaSoft.KapibaraStudio.slnx --no-restore -c Release
      - run: dotnet test EsilvaSoft.KapibaraStudio.slnx --no-build --no-restore -c Release --logger trx --results-directory TestResults
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
