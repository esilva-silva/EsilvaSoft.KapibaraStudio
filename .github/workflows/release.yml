name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version (builds artifacts only, no GitHub release)
        required: true
        default: 0.0.0-manual

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DESKTOP_PROJECT: src/EsilvaSoft.KapibaraStudio.Desktop/EsilvaSoft.KapibaraStudio.Desktop.csproj

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then version="${GITHUB_REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version'. Use MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-suffix."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  # Unit tests on both systems, source guard on Linux and integration on Windows; no benchmarks.
  test:
    uses: ./.github/workflows/ci.yml

  package:
    name: package (${{ matrix.rid }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One parallel job per executable. ARM64 is cross-compiled, so no ARM hardware is required.
      # Each platform family publishes with its own ONNX Runtime backend and lock file.
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, backend: WinML }
          - { rid: win-arm64, os: windows-latest, backend: WinML }
          - { rid: linux-x64, os: ubuntu-24.04, backend: Cpu }
          - { rid: linux-arm64, os: ubuntu-latest, backend: Cpu }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: EsilvaSoft.KapibaraStudio-${{ needs.version.outputs.version }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore
        run: dotnet restore ${{ env.DESKTOP_PROJECT }} --locked-mode -p:SlopOnnxBackend=${{ matrix.backend }}
      - name: Publish
        run: >-
          dotnet publish ${{ env.DESKTOP_PROJECT }} --no-restore -c Release -r ${{ matrix.rid }} --self-contained true
          -p:SlopOnnxBackend=${{ matrix.backend }} -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableClaudeCodeIntegration=false
          -p:DebugType=none -p:PublishDocumentationFiles=false -p:PublishReferencesDocumentationFiles=false
          -p:Version=${{ env.VERSION }} -o publish
      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb, publish/*.xml, publish/*.lib -ErrorAction Ignore
          if (-not $IsWindows) {
            chmod +x publish/EsilvaSoft.KapibaraStudio.Desktop
          }
          ./eng/Test-ReleasePackage.ps1 -PublishDirectory 'publish' -Rid '${{ matrix.rid }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($IsWindows) {
            Compress-Archive -Path publish/* -DestinationPath "dist/$env:PACKAGE.zip"
          } else {
            . ./eng/ReleasePackaging.ps1
            New-KapibaraLinuxPackage (Join-Path $PWD 'publish') (Join-Path $PWD "dist/$env:PACKAGE.tar.gz") '${{ matrix.rid }}'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, test, package]
    if: github.event_name == 'push' && github.repository == 'esilva-silva/EsilvaSoft.KapibaraStudio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EsilvaSoft.KapibaraStudio-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EsilvaSoft.KapibaraStudio ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
